name: Scheduled SQL and backups

on:
  push:
    paths:
      - "src/scheduler.rs"
      - "src/scheduler/**"
      - "src/config.rs"
      - "src/db/sqlite.rs"
      - "src/db/backup.rs"
      - "src/app.rs"
      - "src/main.rs"
      - "src/ui/workflow_dialog.rs"
      - "src/ui/backup_dialog.rs"
      - "src/ui/schema_search.rs"
      - "src/ui/routine_dialog.rs"
      - "src/ui/routine_execute.rs"
      - "tests/scheduler-background.py"
      - "tests/scheduler-diagnostics.py"
      - ".github/workflows/scheduler.yml"
  pull_request:
    paths:
      - "src/scheduler.rs"
      - "src/scheduler/**"
      - "src/config.rs"
      - "src/db/sqlite.rs"
      - "src/db/backup.rs"
      - "src/app.rs"
      - "src/main.rs"
      - "src/ui/workflow_dialog.rs"
      - "src/ui/backup_dialog.rs"
      - "src/ui/schema_search.rs"
      - "src/ui/routine_dialog.rs"
      - "src/ui/routine_execute.rs"
      - "tests/scheduler-background.py"
      - "tests/scheduler-diagnostics.py"
      - ".github/workflows/scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  background:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsqlite3-dev libdbus-1-dev desktop-file-utils
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - id: build
        run: cargo build --locked
      - run: "cargo test --locked scheduler::"
      - run: cargo test --locked footer_actions_stay_visible
      - if: runner.os != 'Windows'
        run: python3 tests/scheduler-background.py target/debug/datacraft
      - name: Exercise the Linux user service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          export DATACRAFT_TEST_DATA_DIR="$RUNNER_TEMP/datacraft-service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$(id -u)"
          sudo systemctl start "user@$(id -u).service"
          systemctl --user set-environment "DATACRAFT_TEST_DATA_DIR=$DATACRAFT_TEST_DATA_DIR"
          trap 'systemctl --user unset-environment DATACRAFT_TEST_DATA_DIR' EXIT
          cargo test --locked scheduler::service::tests::native_service_runs_sql_without_the_gui -- --ignored --exact
      - name: Exercise the macOS LaunchAgent
        if: always() && runner.os == 'macOS' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -e
          export DATACRAFT_TEST_DATA_DIR="$RUNNER_TEMP/datacraft-service"
          launchctl setenv DATACRAFT_TEST_DATA_DIR "$DATACRAFT_TEST_DATA_DIR"
          trap 'launchctl unsetenv DATACRAFT_TEST_DATA_DIR' EXIT
          cargo test --locked scheduler::service::tests::native_service_runs_sql_without_the_gui -- --ignored --exact
      - name: Exercise Linux XDG autostart fallback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export DATACRAFT_TEST_DATA_DIR="$RUNNER_TEMP/datacraft-xdg"
          export DATACRAFT_TEST_XDG=1
          cargo test --locked scheduler::service::tests::native_service_runs_sql_without_the_gui -- --ignored --exact
      - name: Diagnose isolated macOS SQL writer
        if: failure() && runner.os == 'macOS' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -e
          export DATACRAFT_TEST_DATA_DIR="$RUNNER_TEMP/datacraft-sql-only"
          export DATACRAFT_TEST_SQL_ONLY=1
          service="gui/$(id -u)/com.datacraft.scheduler"
          if launchctl print "$service" >/dev/null 2>&1; then launchctl bootout "$service"; fi
          launchctl setenv DATACRAFT_TEST_DATA_DIR "$DATACRAFT_TEST_DATA_DIR"
          trap 'launchctl unsetenv DATACRAFT_TEST_DATA_DIR' EXIT
          cargo test --locked scheduler::service::tests::native_service_runs_sql_without_the_gui -- --ignored --exact
      - if: runner.os == 'Windows'
        run: python tests/scheduler-background.py target/debug/datacraft.exe
      - name: Diagnose disposable scheduler fixtures
        if: failure() && runner.os != 'Windows'
        run: python3 tests/scheduler-diagnostics.py
